# fraim — настройки этого проекта. Едут в git вместе с репозиторием.
# Показать, что действует и откуда: fraim config
#
# Режим работы проекта: reactive (агент делает сам) или fleet (дирижёр и флот)
# mode = reactive
# Сколько коммитов кода без обновления ARCHITECTURE.md считать дрейфом
# foundation_lag_commits = 10
# Сколько коммитов кода (мимо ai/) сверять с файлами плана
# stale_plan_commits = 1
# Сколько коммитов кода без единой записи в Known Pitfalls считать потерей уроков
# lessons_lag_commits = 25
# Сколько точек сохранения без удалённой копии считать проблемой
# unpushed_threshold = 5
# Проверять заблокированные задачи
# check_blockers = on
# Проверять протухшие планы
# check_stale_plans = on
# Проверять планы, написанные другой версией fraim
# check_plan_version = on
# Проверять планы, пересказывающие код вместо ссылок на него
# check_plan_retelling = on
# Проверять исполненные, но не запечатанные задачи
# check_unsealed = on
# Проверять расследования без исхода и незаархивированные
# check_investigations = on
# Проверять, что репозиторий есть — без него нет точек сохранения
# check_git = on
# Проверять, что точки сохранения уезжают с этой машины
# check_remote = on
# Проверять несохранённые изменения фундамента и ai/
# check_dirty = on
# Проверять работу мимо сборки в режиме флота
# check_parallel_drift = on
# Проверять параллельные чекауты проекта — работу, которая идёт не здесь
# check_worktrees = on
# Проверять среду исполнения флота, если она есть на машине
# check_ade = on
# Проверять отставание фундамента от кода
# check_foundation = on
# Проверять, что фундамент соответствует текущему стандарту
# check_shape = on
# Проверять, возвращаются ли грабли в CONVENTIONS.md
# check_lessons = on
# Показывать в вердикте, что приехала новая версия fraim
# check_update = on
# Ходить за обновлениями fraim (только doctor и update, не сторож)
# update_check = on
# Как часто проверять, есть ли новая версия
# update_check_days = 1
# Через сколько дней без исхода чистка закрывает расследование
# abandon_after_days = 30
# Детерминированные глаголы делают коммит сами
# commit_verbs = on
# Команда мастер-проверки: чем дирижёр проверяет собранную сборку целиком, в чекауте её ветки (пусто — проверки нет)
build_check = sh installer/tests/run-tests.sh
